<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Schedule</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e1e4e8; --text: #1f2328;
    --muted: #6a737d; --accent: #2f6feb; --accent-bg: #eef3fe;
    --danger: #d1242f; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header h1 .icon { margin-right: 6px; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  nav.breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 20px; font-size: 14px; }
  nav.breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
  nav.breadcrumb a:hover { text-decoration: underline; }
  nav.breadcrumb .sep { color: var(--muted); }
  nav.breadcrumb .current { color: var(--text); font-weight: 600; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 18px; }
  button.action {
    border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--text);
  }
  button.action:hover { background: var(--accent-bg); border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .tile {
    position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 14px; cursor: pointer; text-align: left; transition: box-shadow .15s, border-color .15s;
  }
  .tile:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .tile.drag-over { border-color: var(--accent); background: var(--accent-bg); }
  .tile .icon { font-size: 26px; display: block; margin-bottom: 8px; }
  .tile .name { font-size: 14px; font-weight: 500; word-break: break-word; }
  .tile .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tile .tile-menu {
    position: absolute; top: 8px; right: 8px; opacity: 0; font-size: 13px; background: none; border: none;
    cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 4px;
  }
  .tile:hover .tile-menu { opacity: 1; }
  .tile .tile-menu:hover { background: var(--border); }
  .empty-state { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
  .status { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><span class="icon">🗓️</span>Field Schedule</h1>
  <span class="status" id="status"></span>
</header>
<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <div class="toolbar">
    <button class="action" id="newFolderBtn">📁 New folder</button>
    <button class="action" id="newCalendarBtn">🗓️ New calendar</button>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="nav.js"></script>
</body>
</html>
